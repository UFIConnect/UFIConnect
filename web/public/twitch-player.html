<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; frame-src https://clips.twitch.tv; img-src 'none'; connect-src 'none'; base-uri 'none'; form-action 'none'; object-src 'none'">
  <meta name="referrer" content="origin">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="dark">
  <title>Twitch player | UFIconnect</title>
  <link rel="stylesheet" href="/twitch-player.css">
  <script defer src="/twitch-player.js"></script>
</head>
<body>
  <main>
    <header>
      <a class="back" href="/">Back to UFIconnect</a>
      <p class="eyebrow">UFIconnect · Twitch player</p>
      <h1 id="clip-title">Twitch clip</h1>
      <p id="creator" hidden></p>
    </header>
    <section id="player" aria-label="Twitch clip player"></section>
    <footer>
      <p id="status" role="status">Loading the Twitch player…</p>
      <button id="reload" type="button" hidden>Reload Twitch player</button>
      <p class="credit">Video and player provided by <strong>Twitch</strong>.</p>
      <a id="original" hidden target="_blank" rel="noopener noreferrer">View original clip on Twitch ↗</a>
    </footer>
    <noscript><p class="no-script">JavaScript is required to show Twitch’s player. Return to UFIconnect to open the original clip.</p></noscript>
  </main>
</body>
</html>
