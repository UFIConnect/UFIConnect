services:
  - type: web
    name: proconnect-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node --max-old-space-size=6144 index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_OPTIONS
        value: --max-old-space-size=6144
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 10000
      - key: AUTH0_DOMAIN
        sync: false
      - key: AUTH0_AUDIENCE
        sync: false
      - key: AUTH0_ISSUER
        sync: false
      - key: RENDER_HOOK_API
        sync: false
      - key: RENDER_HOOK_WEB
        sync: false
      - key: RENDER_HOOK_OFFICE
        sync: false
      - key: RENDER_API_KEY
        sync: false
      - key: RENDER_SERVICE_API_ID
        sync: false
      - key: RENDER_SERVICE_WEB_ID
        sync: false
      - key: RENDER_SERVICE_OFFICE_ID
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://your-expo-app-url.com
