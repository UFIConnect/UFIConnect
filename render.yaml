databases:
  - name: uficonnect-db
    databaseName: uficonnect
    user: ufi_admin
    plan: free

services:
  # ── Backend (Node.js API) ───────────────────────────────────
  - type: web
    name: uficonnect-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node index.js
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_OPTIONS
        value: --max-old-space-size=4096
      - key: JWT_SECRET
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: uficonnect-db
          property: connectionString
      - key: ALLOWED_ORIGINS
        value: https://uficonnect.org,https://www.uficonnect.org,https://uficonnect.pro,https://www.uficonnect.pro,https://uficonnect-web.onrender.com,https://office.uficonnect.org,https://uficonnect-office.onrender.com

  # ── Web Frontend (React static site) ───────────────────────
  - type: web
    name: uficonnect-web
    runtime: static
    domains:
      - uficonnect.org
      - www.uficonnect.org
    rootDir: web
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    envVars:
      - key: VITE_API_URL
        value: https://uficonnect-api.onrender.com
      - key: NODE_OPTIONS
        value: --max-old-space-size=4096

  # ── Office Dashboard (React static site) ────────────────────
  - type: web
    name: uficonnect-office
    runtime: static
    domains:
      - office.uficonnect.org
    rootDir: office
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    envVars:
      - key: VITE_API_URL
        value: https://uficonnect-api.onrender.com
      - key: NODE_OPTIONS
        value: --max-old-space-size=4096
