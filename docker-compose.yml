version: "3.9"

services:

  # ── PostgreSQL ──────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       uficonnect
      POSTGRES_USER:     pc_user
      POSTGRES_PASSWORD: pc_password
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pc_user -d uficonnect"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Backend ─────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV:     production
      PORT:         3000
      JWT_SECRET:   ${JWT_SECRET:-change-me-in-production}
      DATABASE_URL: postgresql://pc_user:pc_password@db:5432/uficonnect
      ALLOWED_ORIGINS: http://localhost:5173,http://localhost:80
    ports:
      - "3000:3000"

  # ── Web (React SPA via nginx) ────────────────────────────────
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""   # empty → uses /api proxy via nginx
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  pg_data:
