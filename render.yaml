    headers:
      - path: /health*
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      # The service worker is the version gate for installed clients. Never
      # let a CDN/browser keep an older worker after a web release.
      - path: /sw.js
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      # The app shell contains no member data; member-specific data arrives
      # through the separate API after boot. Give the CDN a short, safe
      # window to serve the shell from an edge instead of waking the origin.
      - path: /
        name: Cache-Control
        value: public, max-age=60, s-maxage=600, stale-while-revalidate=86400
      - path: /index.html
        name: Cache-Control
        value: public, max-age=60, s-maxage=600, stale-while-revalidate=86400
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # Updated by scripts/sync-security-headers.mjs. Media may use HTTPS
      # providers; executable scripts require the app origin or a fixed hash.
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' 'sha256-gLGGwnWLYJts3F1piq5Gz2YSkGtXpG27BBVWgtZhjg0=' 'sha256-F0CTsePvbvaJJUS918Ug2pR6wyVTBnyJ9A5RJ6xNZ3Y=' https://www.youtube.com https://s.ytimg.com https://www.googletagmanager.com https://www.googleadservices.com https://www.google.com; script-src-attr 'none'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' https: data: blob:; font-src 'self' https://fonts.gstatic.com data:; connect-src 'self' https:; media-src 'self' https: blob:; frame-src 'self' https:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self' https://*.auth0.com https://checkout.stripe.com; frame-ancestors 'self'; upgrade-insecure-requests"
      - path: /*
        name: Strict-Transport-Security
        value: max-age=63072000; includeSubDomains; preload
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      # CSP replaces the obsolete browser XSS filter, which can create XSS bugs.
      - path: /*
        name: X-XSS-Protection
        value: '0'
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
    envVars:
      - key: NODE_VERSION
        value: '24'
      - key: VITE_API_URL
        value: https://api.uficonnect.org
      - key: VITE_ANALYTICS_BRIDGE_URL
        value: https://api.uficonnect.org/analytics-bridge.html
      # Keep the Render hostname available during DNS/TLS propagation and a
      # regional edge failure. The browser chooses it automatically when the
      # public API host cannot answer its lightweight readiness probe.
      - key: VITE_API_FALLBACK_URL
        value: https://uficonnect-api-708r.onrender.com
      - key: VITE_MAINTENANCE_MODE
        value: false
      - key: VITE_AUTH0_DOMAIN
        sync: false
      - key: VITE_AUTH0_CLIENT_ID
        sync: false
      - key: VITE_AUTH0_AUDIENCE
        sync: false
      - key: NODE_OPTIONS
        value: --max-old-space-size=6144

  # ── Office Dashboard (React static site) ────────────────────
  - type: web
    name: uficonnect-office
    runtime: static
    autoDeployTrigger: off
    buildFilter:
      paths:
        - office/**
        - shared/city/**
    domains:
      - office.uficonnect.org
    rootDir: .
    buildCommand: npm ci --prefix office && npm run build --prefix office
    staticPublishPath: office/dist
    routes:
      - type: rewrite
        source: /health
        destination: /health.json
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; script-src-attr 'none'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' https: data: blob:; font-src 'self' https://fonts.gstatic.com data:; connect-src 'self' https:; media-src 'self' https: blob:; frame-src 'self' https:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self' https://*.auth0.com https://checkout.stripe.com; frame-ancestors 'self'; upgrade-insecure-requests"
      - path: /health*
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /index.html
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: Strict-Transport-Security
        value: max-age=63072000; includeSubDomains; preload
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-XSS-Protection
        value: '0'
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      # Internal ops dashboard — no reason for this to be publicly
      # searchable. robots.txt covers well-behaved crawlers; this header
      # is the more reliable belt-and-suspenders version.
      - path: /*
        name: X-Robots-Tag
        value: noindex, nofollow
    envVars:
      - key: NODE_VERSION
        value: '24'
      - key: VITE_API_URL
        value: https://api.uficonnect.org
      # uficonnect-pipeline's own URL — Live Sources/Pipeline/Topics/agent
      # cards for source-fetchers point here now instead, since that's the
      # service actually doing the fetching post-split. Not secret (it's the
      # same public health-check URL, just not user-facing), so it's baked
      # in directly rather than sync:false — this was left unset before,
      # which meant the dashboard had been silently showing the api
      # service's own (empty, post-split) data for every "pipeline" view.
      - key: VITE_PIPELINE_API_URL
        value: https://uficonnect-pipeline-708r.onrender.com
      - key: NODE_OPTIONS
        value: --max-old-space-size=6144
