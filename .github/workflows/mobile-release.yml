name: Mobile release

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        required: true
        default: all
        type: choice
        options:
          - all
          - android
          - ios
      profile:
        description: EAS build profile
        required: true
        default: production
        type: choice
        options:
          - production
          - preview

permissions:
  contents: read

concurrency:
  group: mobile-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      APP_ENV: production
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install verification tools
        run: npm ci
        working-directory: .

      - name: Install app dependencies
        run: npm ci

      - name: Verify security and dependency compatibility
        run: npm run test:security

      - name: Check known dependency advisories
        run: npm audit --audit-level=high

      - name: Validate Expo configuration
        run: npm run doctor

      - name: Export production bundles for all platforms
        run: npm run export -- --output-dir .cache/export-sdk57

      - name: Install browser for exported app checks
        run: npx playwright install --with-deps chromium
        working-directory: .

      - name: Verify exported app sign-in and security settings
        run: npm run test:export

      - name: Verify exported app analytics consent and privacy
        run: npm run test:analytics

      - name: Set up Expo and EAS
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Queue EAS build
        env:
          BUILD_PLATFORM: ${{ inputs.platform }}
          BUILD_PROFILE: ${{ inputs.profile }}
        run: eas build --platform "$BUILD_PLATFORM" --profile "$BUILD_PROFILE" --non-interactive --no-wait
