name: Deploy Render Services

on:
  workflow_run:
    workflows: [Verify UFIconnect]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-render-main
  cancel-in-progress: false

jobs:
  deploy-render:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    environment: main - uficonnect-pipeline-708r
    env:
      VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
      RENDER_HOOK_API: ${{ secrets.RENDER_HOOK_API }}
      RENDER_HOOK_WEB: ${{ secrets.RENDER_HOOK_WEB }}
      RENDER_HOOK_OFFICE: ${{ secrets.RENDER_HOOK_OFFICE }}
      RENDER_HOOK_PIPELINE: ${{ secrets.RENDER_HOOK_PIPELINE }}
    steps:
      - name: Require all release destinations
        run: |
          missing=0
          for hook_name in RENDER_HOOK_API RENDER_HOOK_WEB RENDER_HOOK_OFFICE RENDER_HOOK_PIPELINE; do
            if [[ -z "${!hook_name}" ]]; then
              echo "::error::Missing GitHub Actions secret: ${hook_name}. No services have been deployed."
              missing=1
            fi
          done
          if [[ "$missing" != 0 ]]; then
            exit 1
          fi

      - name: Deploy the latest verified commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for hook_name in RENDER_HOOK_API RENDER_HOOK_WEB RENDER_HOOK_OFFICE RENDER_HOOK_PIPELINE; do
            url="${!hook_name}"
            latest_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
            if [[ "$latest_sha" != "$VERIFIED_SHA" ]]; then
              echo "Skipping a superseded verified commit. A newer main commit must finish verification."
              exit 0
            fi
            sep='?'
            [[ "$url" == *\?* ]] && sep='&'
            curl --proto '=https' --connect-timeout 10 --max-time 60 -fsS -X POST "${url}${sep}ref=${VERIFIED_SHA}"
          done
