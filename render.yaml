databases:
  - name: uficonnect-db
    databaseName: uficonnect
    user: ufi_admin
    # 5 GB database storage. Render's database plan is compute; storage is
    # tracked separately as diskSizeGB.
    diskSizeGB: 5

# Deploy hooks are invoked only by the verified-commit workflow. Using a hook's
# ref parameter disables Render auto-deploys, so keep this ownership explicit.
services:
  # ── Backend (Node.js API) ───────────────────────────────────
  - type: web
    name: uficonnect-api
    # First-party API hostname. Once Render verifies it and Cloudflare proxies
    # the CNAME, visitors get the same global dual-stack edge as the website.
    domains:
      - api.uficonnect.org
    runtime: node
    autoDeployTrigger: off
    buildFilter:
      paths:
        - backend/**
    rootDir: backend
    buildCommand: npm ci --omit=dev
    startCommand: node --max-old-space-size=320 index.js
    plan: starter
    healthCheckPath: /readyz
    envVars:
      - key: NODE_ENV
        value: production
      # Ordinary feed traffic is not globally throttled. Login, registration,
      # and password-reset routes keep their own dedicated limits.
      - key: GENERAL_API_RATE_LIMIT
        value: '0'
      # 320MB (was 768) — `plan: starter` is a real 512MB container, and has
      # been this whole time. 768 was set assuming a "1GB instance" upgrade
      # that never actually happened here (render.yaml's plan: never moved
      # off starter — see git blame on this line vs the commit that raised
      # this number). That let V8's heap alone approach the container's full
      # physical RAM before non-heap RSS was even counted, so Render's OOM
      # killer was killing this process before its own RSS_PRESSURE_MB/
      # RSS_CRITICAL_MB guard (below) ever got a chance to react — caught
      # live via uficonnect-pipeline's /health flapping 502/200 while
      # feed_posts_staging sat empty. 320 leaves ~190MB of the real 512MB
      # for non-heap RSS + OS. If more headroom is ever genuinely needed,
      # upgrade `plan:` to standard (2GB) for real and raise these together
      # — don't raise the number alone again.
      - key: NODE_OPTIONS
        value: --max-old-space-size=320
      - key: RSS_PRESSURE_MB
        value: '300'
      - key: RSS_CRITICAL_MB
        value: '360'
      - key: DB_SIZE_LIMIT_MB
        value: '5120'
      - key: RENDER_DB_PLAN
        value: disk-5gb
      - key: FEED_COUNT_CAP_INTERVAL_MS
        value: '300000'
      - key: FEED_UNSEEN_CAP_INTERVAL_MS
        value: '900000'
      - key: ARCHIVE_MAX_AGE_MS
        value: '2592000000'
      - key: ARCHIVE_AGE_PRUNE_INTERVAL_MS
        value: '3600000'
      - key: ARCHIVE_PRUNE_BATCH_SIZE
        value: '10000'
      - key: FEED_SNAPSHOT_CACHE_SWEEP_MS
        value: '300000'
      - key: FEED_SNAPSHOT_MAX_IDLE_MS
        value: '5400000'
      - key: CACHE_MAINTENANCE_INTERVAL_MS
        value: '300000'
      - key: OFFICE_CACHE_RETENTION_MS
        value: '2592000000'
      - key: OFFICE_CACHE_CLEANUP_INTERVAL_MS
        value: '21600000'
      - key: OFFICE_CACHE_MAX_ROWS_PER_TABLE
        value: '5000'
      - key: OFFICE_CACHE_PRUNE_BATCH_SIZE
        value: '5000'
      # 'api' (the default if unset) serves real user traffic and never
      # fetches external sources on its own — see the SERVICE_ROLE gates in
      # backend/index.js. uficonnect-pipeline below sets this to 'pipeline'
      # instead and does all the actual fetching.
      - key: SERVICE_ROLE
        value: api
      - key: JWT_SECRET
        sync: false
      # The API and pipeline must use the same independent 32-byte base64 key.
      - key: OAUTH_TOKEN_ENCRYPTION_KEY
        sync: false
      - key: DATABASE_SSL_MODE
        value: verify-full
      - key: DATABASE_SSL_CA
        sync: false
      - key: NODE_VERSION
        value: '24'
      - key: DATABASE_URL
        # Use the full external URL with verified TLS. Render's internal
        # connectionString uses a self-signed certificate, without verify-full.
        # Restrict the database's external access to the services' egress IPs.
        sync: false
      # Optional read-failover target for when the primary DB above is
      # overloaded or unreachable (see backend/db.js: readQuery/
      # initBackupDB) — only the hot feed queries fail over to it, and only
      # after the primary times out or errors repeatedly. Omit to run with
      # no failover, same as before this existed.
      - key: DATABASE_URL_BACKUP
        sync: false
      - key: BACKUP_FEED_RETENTION_DAYS
        value: '14'
      - key: BACKUP_FEED_MAX_ROWS
        value: '40000'
      - key: BACKUP_DB_LIMIT_MB
        value: '5120'
      - key: BACKUP_DB_RESET_PCT
        value: '85'
      - key: ALLOWED_ORIGINS
        value: https://uficonnect.org,https://www.uficonnect.org,https://uficonnect.pro,https://www.uficonnect.pro,https://uficonnect-web.onrender.com,https://office.uficonnect.org,https://uficonnect-office.onrender.com
      # Only these public sites may embed the isolated optional Google tag.
      # Add the Expo web deployment's exact origin when hosting it elsewhere.
      - key: ANALYTICS_PARENT_ORIGINS
        value: https://uficonnect.org,https://www.uficonnect.org,https://uficonnect.pro,https://www.uficonnect.pro,https://uficonnect-web.onrender.com,https://yosufkaka99-alt.github.io,https://app.uficonnect.org
      - key: API_BASE_URL
        value: https://api.uficonnect.org
      - key: FALLBACK_API_BASE_URL
        value: https://uficonnect-api-708r.onrender.com
      # Keep Render as the emergency transport origin for ordinary web API
      # traffic. OAuth callback URLs must always use the public hostname.
      - key: PUBLIC_API_URL
        value: https://api.uficonnect.org
      - key: OAUTH_CALLBACK_BASE_URL
        value: https://api.uficonnect.org
      - key: FRONTEND_URL
        value: https://uficonnect.org
      # Auth0 API verifier. AUTH0_AUDIENCE must match the API Identifier in Auth0.
      - key: AUTH0_DOMAIN
        sync: false
      - key: AUTH0_AUDIENCE
        sync: false
      - key: AUTH0_ISSUER
        sync: false
      # Manual deploy triggers for the Office Deploy Center.
      # Use either service deploy hook URLs or RENDER_API_KEY with service IDs.
      - key: RENDER_HOOK_API
        sync: false
      - key: RENDER_HOOK_WEB
        sync: false
      - key: RENDER_HOOK_OFFICE
        sync: false
      # uficonnect-pipeline had no deploy hook wired up at all until now —
      # it went 8+ days without picking up new commits because nothing in
      # the Office Deploy Center (or Render's own auto-deploy) was actually
      # redeploying it. Find this under uficonnect-pipeline's own
      # Settings → Deploy Hook in the Render dashboard.
      - key: RENDER_HOOK_PIPELINE
        sync: false
      - key: RENDER_API_KEY
        sync: false
      # Office recovery evidence: primary database and optional feed-copy IDs.
      - key: RENDER_DATABASE_ID
        sync: false
      - key: RENDER_BACKUP_DATABASE_ID
        sync: false
      - key: RENDER_SERVICE_API_ID
        sync: false
      - key: RENDER_SERVICE_WEB_ID
        sync: false
      - key: RENDER_SERVICE_OFFICE_ID
        sync: false
      - key: RENDER_SERVICE_PIPELINE_ID
        sync: false
      # Shared secret gating /office/* (status, manual refresh and deploys).
      # Production Office requests fail closed until this is configured.
      # Enter the same value in the office dashboard's masked access dialog.
      - key: OFFICE_TOKEN
        sync: false
      # Media upload (Cloudinary signed direct upload) — free tier at
      # cloudinary.com. Cloud Name / API Key / API Secret are on the
      # Cloudinary dashboard home page. Until all three are set,
      # /media/upload-signature returns 503 and the compose form's photo/
      # video picker is disabled — no other functionality depends on this.
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # Stripe billing (Pro + Business plan checkout + customer portal).
      # Secret Key and Webhook Secret are on the Stripe dashboard
      # (Developers → API keys / → Webhooks — the webhook secret is per-
      # endpoint, generated when you add https://<this api URL>/billing/
      # webhook as an endpoint listening for checkout.session.completed,
      # customer.subscription.updated, and customer.subscription.deleted).
      # Each Price ID is the recurring Price object for that tier (Product
      # catalog → your product → pricing) — two separate Price objects, can
      # be on the same Product or two different Products. Until Secret Key +
      # Webhook Secret + at least one Price ID are set, checkout and the
      # webhook both return 503 for that tier — no other functionality
      # depends on this.
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
      - key: STRIPE_PRICE_ID_BUSINESS
        sync: false
      - key: STRIPE_PRICE_ID_BUSINESS_TEAM
        sync: false
      # Resume Builder is an independent recurring add-on. Set the preferred
      # value below to an active USD $149.94 Price billed every 6 months.
      - key: STRIPE_RESUME_BUILDER_PRICE_ID
        sync: false
      # Optional monthly cadence for the same Resume Builder access: USD $30/month.
      - key: STRIPE_RESUME_BUILDER_MONTHLY_PRICE_ID
        sync: false
      # Legacy fallback for a pre-existing Price ID. It is only used when the
      # preferred value above is absent and still must match the same price.
      - key: STRIPE_PRICE_ID_RESUME_BUILDER
        sync: false
      # UFI Vault membership: USD $3.94/month. VPN setup is still pending.
      - key: STRIPE_VPN_CONNECTOR_PRICE_ID
        sync: false
      # Web Push (VAPID). Until both are set, pushConfigured() is false and
      # createNotification/sendPushToUser silently skip the push step — the
      # in-app notification itself still gets created either way. Generate
      # a pair with `npx web-push generate-vapid-keys` (or Settings already
      # has one generated this session — see the chat this shipped in).
      # VAPID_SUBJECT defaults to mailto:support@uficonnect.org if unset.
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      # USAJobs (federal government job listings on Opportunities) — free,
      # self-serve, no review: register at https://developer.usajobs.gov/apirequest
      # to get an API key by email within minutes. USAJOBS_USER_AGENT must be
      # set to the exact email address the key was registered with — USAJobs
      # checks this. Until both are set, this source silently returns no
      # results (no other functionality depends on it).
      - key: USAJOBS_API_KEY
        sync: false
      - key: USAJOBS_USER_AGENT
        sync: false
      # Command Center's AI Content Hub and Resume Builder AI assist use
      # OPENAI_API_KEY only. Both routes remain paid-member-only server-side.
      - key: AI_CONTENT_OPENAI_MODEL
        value: gpt-5-mini
      - key: AI_CONTENT_DRAFT_RATE_LIMIT
        value: '60'
      # Media Studio uses this server-side key for image generation, AI text
      # drafting, and OpenAI video jobs. The project needs access to the
      # selected OpenAI video model for video generation to be available.
      - key: OPENAI_API_KEY
        sync: false
      # Content screening uses the same server-side key for member-created
      # posts, comments, messages, and cross-posts. Imported feed content is
      # screened locally in the pipeline so a source burst never turns into
      # an unbounded moderation queue.
      - key: CONTENT_SCREENING_OPENAI_MODEL
        value: omni-moderation-latest
      - key: CONTENT_SCREENING_TIMEOUT_MS
        value: '8000'
      - key: CONTENT_SCREENING_MAX_CONCURRENT
        value: '4'
      - key: CONTENT_SCREENING_MAX_QUEUED
        value: '100'
      - key: CONTENT_SUBMISSION_RATE_LIMIT
        value: '30'
      # OpenAI video defaults. The API creates a queued video job, then the
      # client polls the authenticated status endpoint until it is ready.
      - key: VIDEO_GENERATION_OPENAI_MODEL
        value: sora-2
      - key: VIDEO_GENERATION_OPENAI_SECONDS
        value: '4'
      - key: VIDEO_GENERATION_OPENAI_SIZE
        value: 720x1280
      - key: MEDIA_GENERATION_RATE_LIMIT
        value: '6'
      # Optional long-form provider. For requests over 12 seconds it receives
      # POST {prompt, durationSeconds, duration} and returns a video URL.
      - key: VIDEO_GENERATION_API_URL
        sync: false
      - key: VIDEO_GENERATION_API_KEY
        sync: false
      # ── OAuth credentials (set values in Render dashboard) ──
      - key: LINKEDIN_CLIENT_ID
        sync: false
      - key: LINKEDIN_CLIENT_SECRET
        sync: false
      - key: TWITTER_CLIENT_ID
        sync: false
      - key: TWITTER_CLIENT_SECRET
        sync: false
      - key: INSTAGRAM_APP_ID
        sync: false
      - key: INSTAGRAM_APP_SECRET
        sync: false
      - key: FACEBOOK_APP_ID
        sync: false
      - key: FACEBOOK_APP_SECRET
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITLAB_CLIENT_ID
        sync: false
      - key: GITLAB_CLIENT_SECRET
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: YOUTUBE_CLIENT_ID
        sync: false
      - key: YOUTUBE_CLIENT_SECRET
        sync: false
      # Separate from the OAuth pair above — a free Data API v3 key (see
      # backend/.env.example). Powers keyword search + Shorts detection;
      # falls back to RSS/Invidious (working, but no search or Shorts) if unset.
      - key: YOUTUBE_API_KEY
        sync: false
      - key: REDDIT_CLIENT_ID
        sync: false
      - key: REDDIT_CLIENT_SECRET
        sync: false
      - key: MEDIUM_CLIENT_ID
        sync: false
      - key: MEDIUM_CLIENT_SECRET
        sync: false
      - key: DRIBBBLE_CLIENT_ID
        sync: false
      - key: DRIBBBLE_CLIENT_SECRET
        sync: false
      - key: TWITCH_CLIENT_ID
        sync: false
      - key: TWITCH_CLIENT_SECRET
        sync: false
      - key: THREADS_CLIENT_ID
        sync: false
      - key: THREADS_CLIENT_SECRET
        sync: false
      - key: BEHANCE_CLIENT_ID
        sync: false
      - key: BEHANCE_CLIENT_SECRET
        sync: false
      - key: TIKTOK_CLIENT_KEY
        sync: false
      - key: TIKTOK_CLIENT_SECRET
        sync: false
      # AT Protocol OAuth uses a signed client assertion rather than a
      # traditional client ID/secret pair.
      - key: BLUESKY_SIGNING_KEY
        sync: false
      - key: BLUESKY_CLIENT_ID
        sync: false
      - key: BLUESKY_CLIENT_SECRET
        sync: false
      # Read-only — repo search/commits/issues (see GITHUB_HEADERS). Separate
      # from AUTOFIX_GITHUB_TOKEN below, which needs write access.
      - key: GITHUB_TOKEN
        sync: false
      # ── Office dashboard: Autofix agent ──────────────────────────────────
      # Detection/logging always run regardless of this flag; only
      # committing a generated fix is gated by it, and that in turn still
      # requires AUTOFIX_GITHUB_TOKEN (unset for now) before anything can
      # actually be committed — so this is enabled but not yet capable of
      # shipping anything. See backend/.env.example and office/src's
      # Autofix view.
      - key: AUTOFIX_ENABLED
        value: 'true'
      # A NEW, separate PAT scoped to contents:write on this one repo only —
      # do not reuse GITHUB_TOKEN above, which stays read-only.
      - key: AUTOFIX_GITHUB_TOKEN
        sync: false
      # Dedicated Office Controls token for reviewed frontend commits and
      # mobile workflow dispatches. Contents + Actions write on this repo only.
      - key: OFFICE_GITHUB_TOKEN
        sync: false
      - key: AUTOFIX_GITHUB_OWNER
        value: UFIConnect
      - key: AUTOFIX_GITHUB_REPO
        value: UFIConnect

  # ── Pipeline (same codebase as uficonnect-api, SERVICE_ROLE=pipeline) ───
  # Does all real external-source fetching — the ~30 continuous background
  # workers — and writes to feed_posts_staging instead of feed_posts_cache.
  # uficonnect-api reads the promoted result via its own transfer job
  # (transferStagedPosts) instead of fetching anything itself. type: web
  # (not worker) so it can still serve its own /office/* endpoints for the
  # dashboard's Pipeline/Live Sources/Topics views to reach directly — see
  # office's VITE_PIPELINE_API_URL. No public domain routing: nothing
  # user-facing should ever call this service directly.
  - type: web
    name: uficonnect-pipeline
    runtime: node
    autoDeployTrigger: off
    buildFilter:
      paths:
        - backend/**
    rootDir: backend
    buildCommand: npm ci --omit=dev
    startCommand: node --max-old-space-size=256 index.js
    plan: starter
    healthCheckPath: /readyz
    envVars:
      - key: NODE_ENV
        value: production
      # Leave room for provider response buffers and native allocations on
      # the 512 MB starter instance. Keep the critical RSS guard at 360 MB;
      # reduce the hot working set without deleting durable feed history.
      - key: NODE_OPTIONS
        value: --max-old-space-size=256
      - key: RSS_PRESSURE_MB
        value: '300'
      - key: RSS_CRITICAL_MB
        value: '360'
      - key: STABILITY_CHECK_MS
        value: '30000'
      - key: POST_CACHE_MAX_ENTRIES
        value: '200'
      - key: GLOBAL_FEED_CACHE_LIMIT
        value: '5000'
      - key: SOURCE_REFRESH_WORKER_COUNT
        value: '1'
      - key: DB_SIZE_LIMIT_MB
        value: '5120'
      - key: RENDER_DB_PLAN
        value: disk-5gb
      - key: FEED_COUNT_CAP_INTERVAL_MS
        value: '300000'
      - key: FEED_UNSEEN_CAP_INTERVAL_MS
        value: '900000'
      - key: ARCHIVE_MAX_AGE_MS
        value: '2592000000'
      - key: ARCHIVE_AGE_PRUNE_INTERVAL_MS
        value: '3600000'
      - key: ARCHIVE_PRUNE_BATCH_SIZE
        value: '10000'
      - key: FEED_SNAPSHOT_CACHE_SWEEP_MS
        value: '300000'
      - key: FEED_SNAPSHOT_MAX_IDLE_MS
        value: '5400000'
      - key: CACHE_MAINTENANCE_INTERVAL_MS
        value: '300000'
      - key: OFFICE_CACHE_RETENTION_MS
        value: '2592000000'
      - key: OFFICE_CACHE_CLEANUP_INTERVAL_MS
        value: '21600000'
      - key: OFFICE_CACHE_MAX_ROWS_PER_TABLE
        value: '5000'
      - key: OFFICE_CACHE_PRUNE_BATCH_SIZE
        value: '5000'
      - key: SERVICE_ROLE
        value: pipeline
      - key: JWT_SECRET
        sync: false
      - key: OAUTH_TOKEN_ENCRYPTION_KEY
        sync: false
      - key: DATABASE_SSL_MODE
        value: verify-full
      - key: DATABASE_SSL_CA
        sync: false
      - key: NODE_VERSION
        value: '24'
      - key: DATABASE_URL
        # Match the API's verified external database URL and network allowlist.
        sync: false
      - key: DATABASE_URL_BACKUP
        sync: false
      # Not user-facing, but /office/* still needs a CORS allowance for the
      # dashboard's own browser requests.
      - key: ALLOWED_ORIGINS
        value: https://office.uficonnect.org,https://uficonnect-office.onrender.com
      # Same office-token gate as uficonnect-api's /office/* routes.
      - key: OFFICE_TOKEN
        sync: false
      # ── Source credentials — same values as uficonnect-api above, entered
      # separately since Render env vars aren't shared across services.
      - key: LINKEDIN_CLIENT_ID
        sync: false
      - key: LINKEDIN_CLIENT_SECRET
        sync: false
      - key: TWITTER_CLIENT_ID
        sync: false
      - key: TWITTER_CLIENT_SECRET
        sync: false
      - key: INSTAGRAM_APP_ID
        sync: false
      - key: INSTAGRAM_APP_SECRET
        sync: false
      - key: FACEBOOK_APP_ID
        sync: false
      - key: FACEBOOK_APP_SECRET
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITLAB_CLIENT_ID
        sync: false
      - key: GITLAB_CLIENT_SECRET
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: YOUTUBE_CLIENT_ID
        sync: false
      - key: YOUTUBE_CLIENT_SECRET
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      - key: REDDIT_CLIENT_ID
        sync: false
      - key: REDDIT_CLIENT_SECRET
        sync: false
      - key: MEDIUM_CLIENT_ID
        sync: false
      - key: MEDIUM_CLIENT_SECRET
        sync: false
      - key: DRIBBBLE_CLIENT_ID
        sync: false
      - key: DRIBBBLE_CLIENT_SECRET
        sync: false
      - key: TWITCH_CLIENT_ID
        sync: false
      - key: TWITCH_CLIENT_SECRET
        sync: false
      - key: THREADS_CLIENT_ID
        sync: false
      - key: THREADS_CLIENT_SECRET
        sync: false
      - key: BEHANCE_CLIENT_ID
        sync: false
      - key: BEHANCE_CLIENT_SECRET
        sync: false
      - key: TIKTOK_CLIENT_KEY
        sync: false
      - key: TIKTOK_CLIENT_SECRET
        sync: false
      - key: BLUESKY_SIGNING_KEY
        sync: false
      - key: BLUESKY_CLIENT_ID
        sync: false
      - key: BLUESKY_CLIENT_SECRET
        sync: false
      - key: USAJOBS_API_KEY
        sync: false
      - key: USAJOBS_USER_AGENT
        sync: false
      - key: GITHUB_TOKEN
        sync: false

  # ── Web Frontend (React static site) ───────────────────────
  - type: web
    name: uficonnect-web
    runtime: static
    autoDeployTrigger: off
    buildFilter:
      paths:
        - web/**
        - shared/city/**
    domains:
      - uficonnect.org
      - www.uficonnect.org
    rootDir: .
    buildCommand: npm ci --prefix web && npm run build --prefix web
    staticPublishPath: web/dist
    routes:
      - type: rewrite
        source: /health
        destination: /health.json
      - type: redirect
        source: /global-scroll
        destination: /global
      - type: redirect
        source: /global-scroll/
        destination: /global
      - type: redirect
        source: /hq
        destination: /command-center
      - type: redirect
        source: /hq/
        destination: /command-center
      - type: redirect
        source: /agents
        destination: /command-center
      - type: redirect
        source: /agents/
        destination: /command-center
      - type: rewrite
        source: /policies
        destination: /policies/index.html
      - type: rewrite
        source: /policies/
        destination: /policies/index.html
      - type: rewrite
        source: /copyright
        destination: /copyright/index.html
      - type: rewrite
        source: /copyright/
        destination: /copyright/index.html
      - type: rewrite
        source: /vault-device
        destination: /vault-device/index.html
      - type: rewrite
        source: /vault-device/
        destination: /vault-device/index.html
      - type: rewrite
        source: /how-office-works
        destination: /how-office-works/index.html
      - type: rewrite
        source: /how-office-works/
        destination: /how-office-works/index.html
      - type: rewrite
        source: /global
        destination: /global/index.html
      - type: rewrite
        source: /global/
        destination: /global/index.html
      - type: rewrite
        source: /register
        destination: /register/index.html
      - type: rewrite
        source: /register/
        destination: /register/index.html
      - type: rewrite
        source: /login
        destination: /login/index.html
      - type: rewrite
        source: /login/
        destination: /login/index.html
      - type: rewrite
        source: /search
        destination: /search/index.html
      - type: rewrite
        source: /search/
        destination: /search/index.html
      - type: rewrite
        source: /privacy
