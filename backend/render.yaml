services:
  - type: web
    name: proconnect-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node --max-old-space-size=6144 index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_OPTIONS
        value: --max-old-space-size=6144
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 10000
      - key: AUTH0_DOMAIN
        sync: false
      - key: AUTH0_AUDIENCE
        sync: false
      - key: AUTH0_ISSUER
        sync: false
      - key: RENDER_HOOK_API
        sync: false
      - key: RENDER_HOOK_WEB
        sync: false
      - key: RENDER_HOOK_OFFICE
        sync: false
      - key: RENDER_API_KEY
        sync: false
      - key: RENDER_SERVICE_API_ID
        sync: false
      - key: RENDER_SERVICE_WEB_ID
        sync: false
      - key: RENDER_SERVICE_OFFICE_ID
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://uficonnect.org,https://www.uficonnect.org,https://uficonnect-web.onrender.com,https://office.uficonnect.org,https://uficonnect-office.onrender.com
      - key: API_BASE_URL
        value: https://uficonnect-api.onrender.com
      - key: FRONTEND_URL
        value: https://uficonnect.org
      - key: LINKEDIN_CLIENT_ID
        sync: false
      - key: LINKEDIN_CLIENT_SECRET
        sync: false
      - key: TWITTER_CLIENT_ID
        sync: false
      - key: TWITTER_CLIENT_SECRET
        sync: false
      - key: INSTAGRAM_APP_ID
        sync: false
      - key: INSTAGRAM_APP_SECRET
        sync: false
      - key: FACEBOOK_APP_ID
        sync: false
      - key: FACEBOOK_APP_SECRET
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITLAB_CLIENT_ID
        sync: false
      - key: GITLAB_CLIENT_SECRET
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: YOUTUBE_CLIENT_ID
        sync: false
      - key: YOUTUBE_CLIENT_SECRET
        sync: false
      - key: REDDIT_CLIENT_ID
        sync: false
      - key: REDDIT_CLIENT_SECRET
        sync: false
      - key: MEDIUM_CLIENT_ID
        sync: false
      - key: MEDIUM_CLIENT_SECRET
        sync: false
      - key: DRIBBBLE_CLIENT_ID
        sync: false
      - key: DRIBBBLE_CLIENT_SECRET
        sync: false
      - key: BEHANCE_CLIENT_ID
        sync: false
      - key: BEHANCE_CLIENT_SECRET
        sync: false
      - key: TIKTOK_CLIENT_KEY
        sync: false
      - key: TIKTOK_CLIENT_SECRET
        sync: false
      - key: BLUESKY_CLIENT_ID
        sync: false
      - key: BLUESKY_CLIENT_SECRET
        sync: false
