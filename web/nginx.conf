# This file is installed as an official nginx image startup template.
# Only API_UPSTREAM is substituted; nginx request variables remain intact.
log_format privacy '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                   '$status $body_bytes_sent';

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # OAuth codes, reset tokens, and referrers must not appear in access logs.
    access_log /var/log/nginx/access.log privacy;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        # A location with add_header must repeat inherited security headers.
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    location ^~ /api/ {
        proxy_pass         http://${API_UPSTREAM}/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        # This is the only externally reachable proxy in both Compose examples.
        # Replace any client-supplied chain before internal proxies append hops.
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
