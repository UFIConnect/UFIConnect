<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#6366F1" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="UFIConnect" />

    <!-- Primary meta -->
    <title>UFIConnect — Professional Networking, No Ads</title>
    <meta name="description" content="UFIConnect is a clean, focused professional network for engineers, designers, founders and creatives. Discover communities, live job listings, and opportunities — all tailored to your role." />
    <meta name="keywords" content="professional network, remote jobs, tech community, engineers, designers, founders, job listings, networking platform, career opportunities" />
    <meta name="author" content="UFIConnect" />
    <link rel="canonical" href="https://uficonnect.org" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://uficonnect.org" />
    <meta property="og:title" content="UFIConnect — Professional Networking, No Ads" />
    <meta property="og:description" content="A clean professional network for engineers, designers, founders and creatives. Live communities, job listings, and opportunities tailored to you." />
    <meta property="og:image" content="https://uficonnect.org/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="UFIConnect" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@uficonnect" />
    <meta name="twitter:title" content="UFIConnect — Professional Networking, No Ads" />
    <meta name="twitter:description" content="A clean professional network for engineers, designers, founders and creatives. Live communities, job listings, and opportunities tailored to you." />
    <meta name="twitter:image" content="https://uficonnect.org/og-image.png" />

    <!-- Robots -->
    <meta name="robots" content="index, follow" />
    <meta name="googlebot" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />

    <!-- JSON-LD structured data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "UFIConnect",
      "url": "https://uficonnect.org",
      "description": "Professional networking platform for engineers, designers, founders and creatives. No ads, no algorithms.",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://uficonnect.org/groups?search={search_term_string}",
        "query-input": "required name=search_term_string"
      },
      "sameAs": []
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "UFIConnect",
      "url": "https://uficonnect.org",
      "logo": "https://uficonnect.org/favicon.svg",
      "description": "Clean professional networking for tech professionals — engineers, designers, founders, and creatives.",
      "foundingDate": "2025",
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "customer support",
        "url": "https://uficonnect.org"
      }
    }
    </script>

    <!-- GitHub Pages SPA path restore (pairs with public/404.html) -->
    <script>
      (function(l){
        if(l.search[1]==='p'){
          var decoded=l.search.slice(1).split('&').map(function(s){return s.replace(/~and~/g,'&')});
          window.history.replaceState(null,null,
            l.pathname.slice(0,-1)+(decoded[0].slice(2)||'/') +
            (decoded[1]?'?'+decoded[1].slice(2):'') + l.hash
          );
        }
      }(window.location));
    </script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
