name: Deploy API to Railway

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-api:
    runs-on: ubuntu-latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_SERVICE: ${{ vars.RAILWAY_SERVICE || 'api' }}
      RAILWAY_ENVIRONMENT: ${{ vars.RAILWAY_ENVIRONMENT || 'production' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify backend install
        run: npm install
        working-directory: backend

      - name: Check backend syntax
        run: node --check index.js
        working-directory: backend

      - name: Deploy backend to Railway
        if: env.RAILWAY_TOKEN != ''
        run: npx @railway/cli@latest up --ci --service "$RAILWAY_SERVICE" --environment "$RAILWAY_ENVIRONMENT" --path-as-root .
        working-directory: backend

      - name: Railway token not configured
        if: env.RAILWAY_TOKEN == ''
        run: |
          echo "RAILWAY_TOKEN is not configured."
          echo "Create a Railway project token and add it as a GitHub Actions secret named RAILWAY_TOKEN."
          echo "Optionally set repository variables RAILWAY_SERVICE and RAILWAY_ENVIRONMENT."
