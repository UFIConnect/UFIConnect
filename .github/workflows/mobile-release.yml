name: Mobile release

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact verified commit requested by Office
        required: false
        default: ''
        type: string
      platform:
        description: Platform to build
        required: true
        default: all
        type: choice
        options:
          - all
          - android
          - ios
      profile:
        description: EAS build profile
        required: true
        default: production
        type: choice
        options:
          - production
          - preview

permissions:
  contents: read
  actions: read

concurrency:
  group: mobile-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      APP_ENV: production
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Require the requested commit
        working-directory: .
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          ACTUAL_SHA: ${{ github.sha }}
        run: |
          if [[ -n "$EXPECTED_SHA" && "$EXPECTED_SHA" != "$ACTUAL_SHA" ]]; then
            echo "::error::Main changed after Office verified the requested mobile build. Nothing was queued."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install verification tools
        run: npm ci
        working-directory: .

      - name: Install app dependencies
        run: npm ci

      - name: Verify security and dependency compatibility
        run: npm run test:security

      - name: Check known dependency advisories
        run: npm run audit:security

      - name: Validate Expo configuration
        run: npm run doctor

      - name: Export production bundles for all platforms
        run: npm run export -- --output-dir .cache/export-sdk57

      - name: Install browser for exported app checks
        run: npx playwright install --with-deps chromium
        working-directory: .

      - name: Verify exported app sign-in and security settings
        run: npm run test:export

      - name: Verify exported app analytics consent and privacy
        run: npm run test:analytics

      - name: Recheck the verified Office commit before release credentials
        if: inputs.expected_sha != ''
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          ACTUAL_SHA: ${{ github.sha }}
          ACTUAL_REF: ${{ github.ref }}
        run: |
          if [[ "$ACTUAL_REF" != refs/heads/main || "$EXPECTED_SHA" != "$ACTUAL_SHA" ]]; then
            echo "::error::Office mobile builds require the exact verified main commit. Nothing was queued."
            exit 1
          fi
          latest_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$latest_sha" != "$EXPECTED_SHA" ]]; then
            echo "::error::Main changed during mobile validation. Nothing was queued."
            exit 1
          fi
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/verify.yml/runs?head_sha=${EXPECTED_SHA}&status=completed&per_page=30" > "$RUNNER_TEMP/mobile-verified-runs.json"
          if ! jq -e --arg sha "$EXPECTED_SHA" 'any(.workflow_runs[]; .head_sha == $sha and .status == "completed" and .conclusion == "success" and (.event == "push" or .event == "workflow_dispatch") and ((.path | split("@")[0]) == ".github/workflows/verify.yml"))' "$RUNNER_TEMP/mobile-verified-runs.json" >/dev/null; then
            echo "::error::Successful Verify checks are required for this exact Office mobile commit. Nothing was queued."
            exit 1
          fi

      - name: Set up Expo and EAS
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Preserve dependency audit evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mobile-dependency-audit
          path: mobile/.cache/dependency-audit.json
          include-hidden-files: true

      - name: Queue EAS build
        env:
          BUILD_PLATFORM: ${{ inputs.platform }}
          BUILD_PROFILE: ${{ inputs.profile }}
        run: eas build --platform "$BUILD_PLATFORM" --profile "$BUILD_PROFILE" --non-interactive --no-wait
