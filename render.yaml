databases:
  - name: uficonnect-db
    databaseName: uficonnect
    user: ufi_admin
    plan: free

services:
  # ── Backend (Node.js API) ───────────────────────────────────
  - type: web
    name: uficonnect-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node --max-old-space-size=768 index.js
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_OPTIONS
        value: --max-old-space-size=768
      - key: JWT_SECRET
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: uficonnect-db
          property: connectionString
      - key: ALLOWED_ORIGINS
        value: https://uficonnect.org,https://www.uficonnect.org,https://uficonnect.pro,https://www.uficonnect.pro,https://uficonnect-web.onrender.com,https://office.uficonnect.org,https://uficonnect-office.onrender.com
      - key: API_BASE_URL
        value: https://uficonnect-api-708r.onrender.com
      - key: FRONTEND_URL
        value: https://uficonnect.org
      # Auth0 API verifier. AUTH0_AUDIENCE must match the API Identifier in Auth0.
      - key: AUTH0_DOMAIN
        sync: false
      - key: AUTH0_AUDIENCE
        sync: false
      - key: AUTH0_ISSUER
        sync: false
      # Manual deploy triggers for the Office Deploy Center.
      # Use either service deploy hook URLs or RENDER_API_KEY with service IDs.
      - key: RENDER_HOOK_API
        sync: false
      - key: RENDER_HOOK_WEB
        sync: false
      - key: RENDER_HOOK_OFFICE
        sync: false
      - key: RENDER_API_KEY
        sync: false
      - key: RENDER_SERVICE_API_ID
        sync: false
      - key: RENDER_SERVICE_WEB_ID
        sync: false
      - key: RENDER_SERVICE_OFFICE_ID
        sync: false
      # Shared secret gating /office/* (status, manual refresh triggers, and
      # the deploy trigger). Until this is set the API accepts unauthenticated
      # office requests (backward compatible) — set a value here, then enter
      # the same value in the office dashboard when prompted.
      - key: OFFICE_TOKEN
        sync: false
      # Media upload (Cloudinary signed direct upload) — free tier at
      # cloudinary.com. Cloud Name / API Key / API Secret are on the
      # Cloudinary dashboard home page. Until all three are set,
      # /media/upload-signature returns 503 and the compose form's photo/
      # video picker is disabled — no other functionality depends on this.
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # USAJobs (federal government job listings on Opportunities) — free,
      # self-serve, no review: register at https://developer.usajobs.gov/apirequest
      # to get an API key by email within minutes. USAJOBS_USER_AGENT must be
      # set to the exact email address the key was registered with — USAJobs
      # checks this. Until both are set, this source silently returns no
      # results (no other functionality depends on it).
      - key: USAJOBS_API_KEY
        sync: false
      - key: USAJOBS_USER_AGENT
        sync: false
      # ── OAuth credentials (set values in Render dashboard) ──
      - key: LINKEDIN_CLIENT_ID
        sync: false
      - key: LINKEDIN_CLIENT_SECRET
        sync: false
      - key: TWITTER_CLIENT_ID
        sync: false
      - key: TWITTER_CLIENT_SECRET
        sync: false
      - key: INSTAGRAM_APP_ID
        sync: false
      - key: INSTAGRAM_APP_SECRET
        sync: false
      - key: FACEBOOK_APP_ID
        sync: false
      - key: FACEBOOK_APP_SECRET
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITLAB_CLIENT_ID
        sync: false
      - key: GITLAB_CLIENT_SECRET
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: YOUTUBE_CLIENT_ID
        sync: false
      - key: YOUTUBE_CLIENT_SECRET
        sync: false
      - key: REDDIT_CLIENT_ID
        sync: false
      - key: REDDIT_CLIENT_SECRET
        sync: false
      - key: MEDIUM_CLIENT_ID
        sync: false
      - key: MEDIUM_CLIENT_SECRET
        sync: false
      - key: DRIBBBLE_CLIENT_ID
        sync: false
      - key: DRIBBBLE_CLIENT_SECRET
        sync: false
      - key: BEHANCE_CLIENT_ID
        sync: false
      - key: BEHANCE_CLIENT_SECRET
        sync: false
      - key: TIKTOK_CLIENT_KEY
        sync: false
      - key: TIKTOK_CLIENT_SECRET
        sync: false
      - key: BLUESKY_CLIENT_ID
        sync: false
      - key: BLUESKY_CLIENT_SECRET
        sync: false

  # ── Web Frontend (React static site) ───────────────────────
  - type: web
    name: uficonnect-web
    runtime: static
    domains:
      - uficonnect.org
      - www.uficonnect.org
    rootDir: web
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # No CSP here: this app aggregates content/avatars from dozens of
      # external sources (Reddit, GitHub, YouTube, etc.) with no fixed
      # domain list, so a real img-src/connect-src allowlist needs its own
      # dedicated audit rather than a guess that risks silently breaking
      # feed images. These are the headers safe to set without that risk.
      - path: /*
        name: Strict-Transport-Security
        value: max-age=63072000; includeSubDomains; preload
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
    envVars:
      - key: VITE_API_URL
        value: https://uficonnect-api-708r.onrender.com
      - key: VITE_MAINTENANCE_MODE
        value: false
      - key: VITE_AUTH0_DOMAIN
        sync: false
      - key: VITE_AUTH0_CLIENT_ID
        sync: false
      - key: VITE_AUTH0_AUDIENCE
        sync: false
      # Google Analytics 4 Measurement ID (looks like G-XXXXXXX). Paste it in
      # here once a GA4 property exists for uficonnect.org — page tracking
      # code is already wired up and no-ops safely until this is set.
      - key: VITE_GA_MEASUREMENT_ID
        sync: false
      - key: NODE_OPTIONS
        value: --max-old-space-size=6144

  # ── Office Dashboard (React static site) ────────────────────
  - type: web
    name: uficonnect-office
    runtime: static
    domains:
      - office.uficonnect.org
    rootDir: office
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: Strict-Transport-Security
        value: max-age=63072000; includeSubDomains; preload
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      # Internal ops dashboard — no reason for this to be publicly
      # searchable. robots.txt covers well-behaved crawlers; this header
      # is the more reliable belt-and-suspenders version.
      - path: /*
        name: X-Robots-Tag
        value: noindex, nofollow
    envVars:
      - key: VITE_API_URL
        value: https://uficonnect-api-708r.onrender.com
      - key: NODE_OPTIONS
        value: --max-old-space-size=6144
