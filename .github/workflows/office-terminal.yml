name: Office terminal
run-name: Office terminal ${{ inputs.session_id }}
on:
  workflow_dispatch:
    inputs:
      session_id:
        type: string
        required: true
      commit_sha:
        type: string
        required: true
      command_b64:
        type: string
        required: true
      timeout_seconds:
        type: string
        required: true
        default: '120'
permissions:
  contents: read
jobs:
  workspace:
    name: Office workspace
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate receipt
        env:
          SESSION_ID: ${{ inputs.session_id }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
          COMMAND_B64: ${{ inputs.command_b64 }}
          TIMEOUT_SECONDS: ${{ inputs.timeout_seconds }}
        run: |
          node <<'NODE'
          const { SESSION_ID, COMMIT_SHA, COMMAND_B64, TIMEOUT_SECONDS } = process.env;
          if (!/^[a-f0-9-]{36}$/i.test(SESSION_ID || '') || !/^[a-f0-9]{40}$/i.test(COMMIT_SHA || '') || !/^[A-Za-z0-9+/]+={0,2}$/.test(COMMAND_B64 || '')) throw Error('Invalid terminal receipt');
          const command = Buffer.from(COMMAND_B64, 'base64').toString('utf8');
          if (!command.trim() || command.length > 12000 || command.includes('\0') || !Number.isInteger(Number(TIMEOUT_SECONDS)) || Number(TIMEOUT_SECONDS) < 30 || Number(TIMEOUT_SECONDS) > 300) throw Error('Invalid terminal limits');
          NODE
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit_sha }}
          persist-credentials: false
          fetch-depth: 1
          submodules: false
      - name: Run bounded command
        env:
          SESSION_ID: ${{ inputs.session_id }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
          COMMAND_B64: ${{ inputs.command_b64 }}
          TIMEOUT_SECONDS: ${{ inputs.timeout_seconds }}
        run: |
          node <<'NODE'
          const { spawn, spawnSync } = require('node:child_process');
          const { randomUUID } = require('node:crypto');
          const command = Buffer.from(process.env.COMMAND_B64, 'base64').toString('utf8');
          const sessionId = process.env.SESSION_ID, commitSha = process.env.COMMIT_SHA;
          const timeoutMs = Number(process.env.TIMEOUT_SECONDS) * 1000;
          // The command runs in a separate PID/mount namespace. Only this
          // credential-free checkout is mounted, never the Docker socket,
          // runner directories, provider secrets, or the host process tree.
          const childEnv = Object.fromEntries(['PATH', 'HOME', 'USER', 'LANG', 'TMPDIR', 'GITHUB_WORKSPACE'].filter(key => process.env[key]).map(key => [key, process.env[key]]));
          Object.assign(childEnv, { CI: 'true', TERM: 'dumb' });
          const container = `office-terminal-${sessionId}`;
          const args = ['run', '--rm', '--name', container, '--cap-drop=ALL', '--security-opt=no-new-privileges', '--pids-limit=256', '--memory=2g', '--cpus=2', '--read-only',
            '--user', `${process.getuid()}:${process.getgid()}`, '--network=bridge', '--workdir=/workspace', '--mount', `type=bind,src=${process.env.GITHUB_WORKSPACE},dst=/workspace`,
            '--tmpfs', '/tmp:rw,nosuid,nodev,size=536870912', '--env=HOME=/tmp/office-home', '--env=CI=true', '--env=TERM=dumb', '--entrypoint=/bin/bash',
            'node:24-bookworm', '--noprofile', '--norc', '-eo', 'pipefail', '-c', 'mkdir -p "$HOME"; ' + command];
          const child = spawn('docker', args, { cwd: process.env.GITHUB_WORKSPACE, env: childEnv, detached: true, stdio: ['ignore', 'pipe', 'pipe'] });
          let bytes = 0, output = [], timedOut = false, outputTruncated = false, finished = false;
          function stop() { spawnSync('docker', ['rm', '-f', container], { env: childEnv, stdio: 'ignore', timeout: 10000 }); try { process.kill(-child.pid, 'SIGKILL'); } catch {} }
          function capture(chunk) { const remaining = 163840 - bytes; if (remaining > 0) { const part = chunk.subarray(0, remaining); output.push(part); bytes += part.length; } if (chunk.length > remaining) { outputTruncated = true; stop(); } }
          child.stdout.on('data', capture); child.stderr.on('data', capture);
          const timer = setTimeout(() => { timedOut = true; stop(); }, timeoutMs);
          function finish(exitCode, signal) {
            if (finished) return; finished = true; clearTimeout(timer); stop();
            const delimiter = randomUUID();
            console.log(`::stop-commands::${delimiter}`);
            process.stdout.write(Buffer.concat(output).toString('utf8').replace(/\x1b\[[0-?]*[ -/]*[@-~]/g, ''));
            console.log(`\n::${delimiter}::`);
            console.log('OFFICE_TERMINAL_RECEIPT ' + JSON.stringify({ sessionId, commitSha, exitCode, signal: signal || null, timedOut, outputTruncated }));
            process.exitCode = timedOut ? 124 : outputTruncated ? 125 : exitCode === null ? 1 : exitCode;
          }
          child.on('error', () => finish(null, 'spawn_failed'));
          child.on('close', finish);
          process.on('SIGTERM', () => finish(null, 'cancelled'));
          process.on('SIGINT', () => finish(null, 'cancelled'));
          NODE
      - name: Clean up workspace container
        if: always()
        env:
          SESSION_ID: ${{ inputs.session_id }}
        run: |
          if [[ "$SESSION_ID" =~ ^[a-fA-F0-9-]{36}$ ]]; then
            docker rm -f -- "office-terminal-$SESSION_ID" >/dev/null 2>&1 || true
          fi
