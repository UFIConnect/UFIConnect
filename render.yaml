databases:
  - name: proconnect-db
    databaseName: proconnect
    user: pc_admin
    plan: free

services:
  # ── Backend (Node.js API) ───────────────────────────────────
  - type: web
    name: proconnect-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node index.js
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000          # Render uses 10000 by default; we override PORT in code via process.env.PORT
      - key: JWT_SECRET
        generateValue: true   # Render auto-generates a secure random value
      - key: DATABASE_URL
        fromDatabase:
          name: proconnect-db
          property: connectionString
      - key: ALLOWED_ORIGINS
        value: https://proconnect.pro,https://www.proconnect.pro,https://proconnect-web.onrender.com

  # ── Web Frontend (React static site) ───────────────────────
  - type: web
    name: proconnect-web
    runtime: static
    rootDir: web
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    plan: free
    routes:
      # SPA: all paths fall back to index.html
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    envVars:
      - key: VITE_API_URL
        value: https://proconnect-api.onrender.com
