name: Verify UFIconnect
on:
  workflow_dispatch: null
  pull_request: null
  push:
    branches:
      - main
permissions:
  contents: read
jobs:
  verify_checks:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        group:
          - core
          - media
          - office
          - backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            web/package-lock.json
            office/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm ci --prefix backend --no-audit --no-fund
      - run: npm ci --prefix web --no-audit --no-fund
      - run: npm ci --prefix office --no-audit --no-fund
      - run: node scripts/check-js.cjs
        if: matrix.group == 'core'
      - run: node --test web/src/utils/feedSourceRoute.test.mjs
        if: matrix.group == 'core'
      - run: npm test --prefix backend
        if: matrix.group == 'backend'
      - run: node --test scripts/office-security.test.mjs scripts/web-security.test.mjs scripts/office-city.test.mjs scripts/office-recovery.test.mjs
        if: matrix.group == 'core'
      - run: node --test scripts/analytics.test.mjs scripts/data-preferences.test.mjs
        if: matrix.group == 'core'
      - run: node --test web/src/businessRoutes.test.mjs web/src/businessAccount.test.mjs web/src/components/snapCameraCommands.test.mjs
        if: matrix.group == 'core'
      - run: node --test scripts/local-web-workbench.test.mjs scripts/local-phone-access.test.mjs
        if: matrix.group == 'core'
      - run: node --test scripts/vault-sync.test.mjs scripts/account-vault.test.mjs scripts/vault-crypto.test.mjs scripts/vault-files.test.mjs scripts/vault-launch-preferences.test.mjs scripts/local-vault-vpn.test.mjs scripts/city-topic-targets.test.mjs
        if: matrix.group == 'core'
      - run: node scripts/sync-analytics-bridge.mjs --check
        if: matrix.group == 'core'
      - run: node scripts/sync-security-headers.mjs --check
        if: matrix.group == 'core'
      - run: node scripts/check-deployment-security.mjs
        if: matrix.group == 'core'
      - run: node scripts/sync-web-routes.mjs --check
        if: matrix.group == 'core'
      - run: npm audit --prefix backend --audit-level=high
        if: matrix.group == 'core'
      - run: npm audit --prefix web --audit-level=high
        if: matrix.group == 'core'
      - run: npm audit --prefix office --audit-level=high
        if: matrix.group == 'core'
      - run: npm run build --prefix web
      - run: npm run build --prefix office
      - run: npx playwright install --with-deps chromium
      - run: node --test infra/office-ai-worker/index.test.mjs infra/office-ai-site/index.test.mjs
        if: matrix.group == 'office'
      - run: node --test scripts/office-command-city.test.mjs
        if: matrix.group == 'office'
      - run: node scripts/audit-office-ai.mjs
        if: matrix.group == 'office'
      - run: node scripts/audit-office-ai-execution.mjs
        if: matrix.group == 'office'
      - run: node scripts/audit-office-ai-functions.mjs
        if: matrix.group == 'office'
      - run: node --test office/src/office-voice.test.mjs office/src/office-welcome.test.mjs office/src/pip-tones.test.mjs office/src/pip-office-context.test.mjs office/src/office-ai-history.test.mjs
        if: matrix.group == 'office'
      - run: node --test office/src/office-requests.test.mjs office/src/office-polling.test.mjs office/src/analytics-comparison-model.test.mjs office/src/office-ai-client.test.mjs
        if: matrix.group == 'office'
      - run: node scripts/audit-office-requests.mjs
        if: matrix.group == 'office'
      - run: node scripts/audit-office-analytics-comparison.mjs
        if: matrix.group == 'office'
      - run: node scripts/audit-office-analytics.mjs
        if: matrix.group == 'office'
      - run: node scripts/audit-office-ai-sensors.mjs
        if: matrix.group == 'office'
      - run: node --test office/src/office-email-templates.test.mjs
        if: matrix.group == 'office'
      - run: node --test office/src/source-rate-display.test.mjs web/src/components/sourceCollection.test.mjs
        if: matrix.group == 'office'
      - run: node scripts/audit-office-source-rates.mjs
        if: matrix.group == 'office'
      - run: node scripts/audit-office-navigation.mjs
        if: matrix.group == 'office'
      - run: node web/tests/source-navigation.browser.mjs
        if: matrix.group == 'office'
      - run: node web/tests/source-collection.browser.mjs
        if: matrix.group == 'office'
      - run: node office/tests/email-selection.browser.mjs
        if: matrix.group == 'office'
      - run: node office/tests/analytics-refresh.browser.mjs
        if: matrix.group == 'office'
      - run: node scripts/sync-security-headers.mjs --check --built
        if: matrix.group == 'core'
      - run: node scripts/audit-security.mjs
        if: matrix.group == 'core'
      - run: node scripts/audit-csp.mjs
        if: matrix.group == 'core'
      - run: node scripts/audit-public-seo.mjs
        if: matrix.group == 'core'
      - run: node scripts/audit-member-startup.mjs
        if: matrix.group == 'core'
      - run: node scripts/audit-memberships.mjs
        if: matrix.group == 'core'
      - run: node scripts/audit-command-pricing.mjs
        if: matrix.group == 'core'
      - run: node scripts/audit-business.mjs
        if: matrix.group == 'core'
      - run: node scripts/audit-business-signup.mjs
        if: matrix.group == 'core'
      - run: node scripts/audit-business-team.mjs
        if: matrix.group == 'core'
      - run: node scripts/audit-business-industries.mjs
        if: matrix.group == 'core'
      - run: node scripts/audit-post-likes.mjs
        if: matrix.group == 'core'
      - run: node scripts/audit-confirmations.mjs
        if: matrix.group == 'core'
      - run: node scripts/audit-analytics.mjs
        if: matrix.group == 'core'
      - run: node scripts/audit-google-ads.mjs
        if: matrix.group == 'core'
      - run: node scripts/audit-data-preferences.mjs
        if: matrix.group == 'core'
      - run: node scripts/audit-vault-analytics-public.mjs
        if: matrix.group == 'core'
      - run: node scripts/audit-vault-files.mjs
        if: matrix.group == 'core'
      - run: node scripts/audit-vault-autofill.mjs
        if: matrix.group == 'core'
      - run: node scripts/audit-ui.mjs
        if: matrix.group == 'core'
      - run: node scripts/audit-map-settings.mjs
        if: matrix.group == 'media'
      - run: node scripts/audit-group-navigation.mjs
        if: matrix.group == 'media'
      - run: node scripts/audit-mobile-account-sidebar.mjs
        if: matrix.group == 'media'
      - run: node scripts/audit-homepage-preparation.mjs
        if: matrix.group == 'media'
      - run: node scripts/audit-jobs-feed.mjs
        if: matrix.group == 'media'
      - run: node scripts/audit-job-posting.mjs
        if: matrix.group == 'media'
      - run: node scripts/audit-snap-camera.mjs
        if: matrix.group == 'media'
      - run: node scripts/audit-music-feed.mjs
        if: matrix.group == 'media'
      - run: node scripts/audit-global-member-feed.mjs
        if: matrix.group == 'media'
      - run: node scripts/audit-video-layout.mjs
        if: matrix.group == 'media'
      - run: node scripts/audit-video-performance.mjs
        if: matrix.group == 'media'
      - run: node scripts/audit-travel.mjs
        if: matrix.group == 'media'
      - run: node scripts/audit-discovery-categories.mjs
        if: matrix.group == 'media'
      - run: node --test web/src/components/publishingAvailability.test.mjs web/src/components/publishingOptions.test.mjs web/src/components/apiKeyConnection.test.mjs
        if: matrix.group == 'media'
      - run: node scripts/audit-publishing-destinations.mjs
        if: matrix.group == 'media'
      - run: node scripts/audit-search-notifications.mjs
        if: matrix.group == 'media'
      - run: node scripts/audit-office-pipeline.mjs
        if: matrix.group == 'office'
      - run: node scripts/audit-office-city.mjs
        if: matrix.group == 'office'
      - run: node scripts/audit-local-web.mjs
        if: matrix.group == 'office'
      - run: node scripts/audit-office-setup.mjs
        if: matrix.group == 'office'
      - run: node scripts/audit-source-favorites.mjs
        if: matrix.group == 'office'
      - run: node scripts/audit-source-directory.mjs
        if: matrix.group == 'office'
      - run: node scripts/audit-interface-release.mjs
        if: matrix.group == 'office'
      - run: node scripts/audit-shop-posts.mjs
        if: matrix.group == 'office'
      - run: node scripts/audit-feed-equalizer.mjs
        if: matrix.group == 'office'
      - run: node scripts/audit-following-connections.mjs
        if: matrix.group == 'office'
      - run: node scripts/audit-post-context.mjs
        if: matrix.group == 'office'
      - run: node scripts/audit-content-history.mjs
        if: matrix.group == 'office'
      - run: node scripts/audit-video-duration.mjs
        if: matrix.group == 'office'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: responsive-audit-screenshots-${{ matrix.group }}
          path: .cache/audit-ui/
          include-hidden-files: true
  verify:
    runs-on: ubuntu-latest
    needs: verify_checks
    if: ${{ always() }}
    steps:
      - name: Require every verification group to pass
        run: test "${{ needs.verify_checks.result }}" = "success"
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      APP_ENV: production
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            mobile/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm ci --prefix backend --no-audit --no-fund
      - run: npm ci --prefix mobile --no-audit --no-fund
      - run: npm run test:security --prefix mobile
      - run: npm run audit:security --prefix mobile
      - run: npm run doctor --prefix mobile
      - run: npm run export -- --output-dir .cache/export-sdk57
        working-directory: mobile
      - run: npx playwright install --with-deps chromium
      - run: npm run test:export --prefix mobile
      - run: npm run test:analytics --prefix mobile
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-web-security-screenshots
          path: |
            mobile/.cache/export-security-*.png
            mobile/.cache/dependency-audit.json
          include-hidden-files: true
