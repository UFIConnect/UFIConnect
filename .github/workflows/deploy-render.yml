name: Deploy Render Services

on:
  push:
    branches: [main]
    # Skip audit/workflow-only corrections; any runtime change still deploys.
    paths-ignore:
      - scripts/audit-member-startup.mjs
      - scripts/audit-business-team.mjs
      - .github/workflows/deploy-render.yml
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact verified commit requested by Office (optional for manual dispatch)
        required: false
        default: ''
        type: string
      target:
        description: Render destination to deploy from current main
        required: true
        default: all
        type: choice
        options:
          - all
          - frontends
          - web
          - office
          - api
          - pipeline

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-render-main
  cancel-in-progress: false

jobs:
  deploy-render:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment: main - uficonnect-pipeline-708r
    env:
      DEPLOY_SHA: ${{ github.sha }}
      DEPLOY_TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.target || 'all' }}
      EXPECTED_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_sha || '' }}
      RENDER_HOOK_API: ${{ secrets.RENDER_HOOK_API }}
      RENDER_HOOK_WEB: ${{ secrets.RENDER_HOOK_WEB }}
      RENDER_HOOK_OFFICE: ${{ secrets.RENDER_HOOK_OFFICE }}
      RENDER_HOOK_PIPELINE: ${{ secrets.RENDER_HOOK_PIPELINE }}
    steps:
      - name: Require the current main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ -n "$EXPECTED_SHA" && "$EXPECTED_SHA" != "$DEPLOY_SHA" ]]; then
            echo "::error::Main changed after the requested commit was verified. Nothing was deployed."
            exit 1
          fi
          latest_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$latest_sha" != "$DEPLOY_SHA" ]]; then
            echo "::error::The requested commit is not the current main commit. Deploy the latest main commit instead."
            exit 1
          fi

      - name: Require successful verification of this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 160); do
            latest_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
            if [[ "$latest_sha" != "$DEPLOY_SHA" ]]; then
              echo "::error::Main changed while verification was pending. Nothing was deployed."
              exit 1
            fi
            gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/verify.yml/runs?head_sha=${DEPLOY_SHA}&per_page=30" > "$RUNNER_TEMP/office-verify-runs.json"
            state="$(jq -r --arg sha "$DEPLOY_SHA" '
              [.workflow_runs[] | select(.head_sha == $sha and (.event == "push" or .event == "workflow_dispatch") and ((.path | split("@")[0]) == ".github/workflows/verify.yml"))] |
              if any(.[]; .status == "completed" and .conclusion == "success") then "passed"
              elif length > 0 and all(.[]; .status == "completed") then "failed"
              else "pending" end' "$RUNNER_TEMP/office-verify-runs.json")"
            if [[ "$state" == passed ]]; then
              exit 0
            fi
            if [[ "$state" == failed ]]; then
              echo "::error::Verification did not pass for this exact commit. Nothing was deployed."
              exit 1
            fi
            sleep 15
          done
          echo "::error::Verification did not finish within the deployment wait limit. Nothing was deployed."
          exit 1

      - name: Select and require release destinations
        run: |
          case "$DEPLOY_TARGET" in
            all)       hook_names=(RENDER_HOOK_API RENDER_HOOK_WEB RENDER_HOOK_OFFICE RENDER_HOOK_PIPELINE) ;;
            frontends) hook_names=(RENDER_HOOK_WEB RENDER_HOOK_OFFICE) ;;
            web)       hook_names=(RENDER_HOOK_WEB) ;;
            office)    hook_names=(RENDER_HOOK_OFFICE) ;;
            api)       hook_names=(RENDER_HOOK_API) ;;
            pipeline)  hook_names=(RENDER_HOOK_PIPELINE) ;;
            *) echo "::error::Unknown deployment target: ${DEPLOY_TARGET}"; exit 1 ;;
          esac

          missing=0
          for hook_name in "${hook_names[@]}"; do
            if [[ -z "${!hook_name}" ]]; then
              echo "::error::Missing GitHub Actions secret: ${hook_name}. No services have been deployed."
              missing=1
            fi
          done
          if [[ "$missing" != 0 ]]; then
            exit 1
          fi
          printf '%s\n' "${hook_names[@]}" > "$RUNNER_TEMP/render-hook-names"

      - name: Deploy the latest main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          while IFS= read -r hook_name; do
            latest_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
            if [[ "$latest_sha" != "$DEPLOY_SHA" ]]; then
              echo "::error::Main moved after deployment validation. Remaining services were not deployed."
              exit 1
            fi
            url="${!hook_name}"
            sep='?'
            [[ "$url" == *\?* ]] && sep='&'
            curl --proto '=https' --connect-timeout 10 --max-time 60 -fsS -X POST "${url}${sep}ref=${DEPLOY_SHA}"
          done < "$RUNNER_TEMP/render-hook-names"
